<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>浪漫カメラ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="浪漫カメラ">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b0d">
<style>
  :root { color-scheme: dark; --bg: #0b0b0d; --fg: #ecebe6; --dim: #8d8b86; --line: #2a2a2e; --accent: #f2f1ec; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 -apple-system, "Hiragino Sans", sans-serif; }
  body { padding: calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 24px); max-width: 520px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  header img { height: 34px; filter: drop-shadow(3px 0 0 rgba(255, 40, 60, .75)) drop-shadow(-3px 0 0 rgba(40, 140, 255, .75)); }
  header span { font-size: 13px; letter-spacing: .2em; color: var(--dim); }
  .modes { display: flex; gap: 6px; margin-bottom: 12px; padding: 4px; border-radius: 12px; background: #17171a; border: 1px solid var(--line); }
  .modes button { flex: 1; padding: 10px 6px; border: 0; border-radius: 9px; background: transparent; color: var(--dim); font-weight: 600; }
  .modes button.on { background: var(--accent); color: #111; }
  .pick { display: block; width: 100%; padding: 18px; border-radius: 14px; background: var(--accent); color: #111; text-align: center; font-weight: 700; font-size: 18px; cursor: pointer; }
  .pick input { display: none; }
  body.has .pick { padding: 11px; font-size: 15px; background: #17171a; color: var(--fg); border: 1px solid var(--line); }
  body.has .note { display: none; }
  .note { color: var(--dim); font-size: 13px; margin: 10px 2px 0; }
  #work { margin-top: 14px; }
  .stage { position: relative; width: min(100%, calc(56vh * 9 / 16), calc(56dvh * 9 / 16)); aspect-ratio: 9 / 16; margin: 0 auto; background: #000; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
  .stage img, .stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  .busy { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; background: rgba(0, 0, 0, .55); }
  .bar { width: 80%; height: 6px; border-radius: 3px; background: #333; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .busy small { color: var(--dim); }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 14px; }
  .row label { color: var(--dim); font-size: 14px; white-space: nowrap; }
  input[type=datetime-local] { flex: 1; min-width: 0; font: inherit; color: var(--fg); background: #17171a; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  button { font: inherit; border-radius: 12px; padding: 14px 10px; border: 1px solid var(--line); background: #17171a; color: var(--fg); flex: 1; cursor: pointer; }
  button.main { background: var(--accent); color: #111; font-weight: 700; border-color: var(--accent); }
  button:disabled { opacity: .4; }
  #msg { margin-top: 14px; color: #ff9a8a; font-size: 14px; white-space: pre-wrap; }
  footer { margin-top: 28px; color: #55544f; font-size: 11px; text-align: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header><img src="logo_white.png" alt="浪漫制作"><span>ROMAN CAMERA</span></header>

<div class="modes" id="modes"><button data-mode="vhs">VHS</button><button data-mode="dot">ドット絵</button><button data-mode="game">ゲーム</button></div>
<label class="pick">写真・動画をえらぶ<input id="file" type="file" accept="image/*,video/*"></label>
<p class="note">iPhoneの中だけで変換します。写真・動画はどこにも送りません。</p>

<section id="work" hidden>
  <div class="stage">
    <img id="outImg" alt="" hidden>
    <video id="outVid" playsinline controls loop hidden></video>
    <div class="busy" id="busy" hidden><div id="busyText">変換中…</div><div class="bar"><i id="barFill"></i></div><small id="busySub">画面を閉じずにお待ちください</small></div>
  </div>
  <div class="row"><button id="save" class="main" disabled>保存・共有</button><button id="reroll" hidden>グリッチを変える</button></div>
  <div class="row"><label for="dt">撮影日時</label><input id="dt" type="datetime-local" step="60"></div>
</section>

<p id="msg"></p>
<footer>浪漫制作 · 浪漫カメラ <span id="ver"></span></footer>
<script type="module" src="app.js"></script>
</body>
</html>
